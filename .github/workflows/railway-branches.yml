name: railway branches

# Regenerates railway/api and railway/web (see scripts/sync_railway_branches.sh).
# Source branch: main (Phase 2 merged on 26 Oct).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/sync_railway_branches.sh "${GITHUB_REF_NAME}"
