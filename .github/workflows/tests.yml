name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # A real PostgreSQL (as on Railway) for the accounts tests; the rest of the suite ignores it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: regimecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/regimecast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as Dockerfile.recorder
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Accounts tests on SQLite too (local development without Postgres)
        run: TEST_DATABASE_URL= python -m pytest -q tests/test_accounts.py
      - name: API contract is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # same as web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typed API client matches docs/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "Run 'npm run gen:api' in web/ and commit src/api/schema.d.ts" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
