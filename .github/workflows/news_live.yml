# Keeps the news mood live without the PC. Every 15 minutes: start from the saved state on
# the branch `news-data` (last 7 days of headlines, their FinBERT scores, the full hourly
# mood), collect new GDELT batches and RSS headlines, score them, rebuild the last days of
# the mood, and write the state back to `news-data`. GET /news-mood on Railway reads
# news-data/api/<SYMBOL>.json (regimecast/sentiment/pipeline.py, latest()).
# The push uses GITHUB_TOKEN, so it starts no other workflows and no Railway deploy.
# GitHub may delay scheduled runs by some minutes; the mood is hourly, so that is fine.
name: news-live

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [phase3-live-news]
    paths: [.github/workflows/news_live.yml]

concurrency:
  group: news-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: news-data
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: collect, score, rebuild the mood
        run: |
          python -m regimecast.sentiment.pipeline import-live --dir state
          python -m regimecast.sentiment.pipeline collect
          python -m regimecast.sentiment.pipeline export-live --out out
          cp state/README.md out/
      - name: publish to news-data
        run: |
          cd out
          git init -q -b news-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "News mood $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news-data
